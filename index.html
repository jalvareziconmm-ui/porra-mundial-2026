<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porra mundial de fútbol 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 820px;
      margin: 0 auto 40px;
      padding: 0 16px 32px;
      background: linear-gradient(135deg, #07145f 0%, #1238f3 45%, #86b9ff 100%);
      color: #111827;
    }

    .app-hero {
      margin: 24px 0 18px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.25);
    }

    .hero-bg {
      min-height: 210px;
      padding: 28px;
      display: flex;
      align-items: center;
      gap: 24px;
      background:
        linear-gradient(135deg, rgba(7, 20, 95, 0.88), rgba(18, 56, 243, 0.74)),
        linear-gradient(45deg, #b7ff00 0 12%, transparent 12% 88%, #b7ff00 88%);
      color: white;
    }

    .hero-logo {
      width: 220px;
      max-width: 34vw;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 14px;
      background: white;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28);
    }

    .hero-kicker {
      margin: 0 0 8px;
      color: #c8ff00;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.04;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 10px 28px rgba(7, 20, 95, 0.16);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      background: #1238f3;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary { background: #166534; }
    button.logout { background: #6b7280; }

    .msg {
      margin-top: 12px;
      font-weight: bold;
    }

    .error { color: #b91c1c; }
    .ok { color: #166534; }

    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .nav-buttons button { background: #1d4ed8; }
    .nav-buttons button.logout { background: #6b7280; }

    .match {
      border-top: 1px solid #e5e7eb;
      padding: 14px 0;
    }

    .match:first-child { border-top: 0; }

    .match-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .match-title {
      font-weight: bold;
      font-size: 17px;
    }

    .bet-form {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .bet-form button,
    .bet-form .msg {
      grid-column: 1 / -1;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      border-top: 1px solid #e5e7eb;
      padding: 12px 0;
    }

    .ranking-row:first-child { border-top: 0; }

    .ranking-row span {
      font-weight: bold;
      color: #166534;
    }

    .ranking-row small {
      grid-column: 1 / -1;
      color: #6b7280;
    }

    .alias-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: #1238f3;
      font: inherit;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
    }

    .alias-button:hover {
      text-decoration: underline;
    }

    .user-bets {
      margin-top: 16px;
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
    }

    .user-bet-row {
      border-top: 1px solid #e5e7eb;
      padding: 12px 0;
    }

    .user-bet-row:first-child {
      border-top: 0;
    }

    .user-bet-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .user-bet-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 12px;
      font-size: 14px;
    }

    .user-bet-grid strong {
      color: #166534;
    }

    @media (max-width: 640px) {
      .hero-bg {
        flex-direction: column;
        align-items: flex-start;
      }

      .hero-logo {
        width: 100%;
        max-width: 100%;
      }

      h1 { font-size: 32px; }
      .bet-form { grid-template-columns: 1fr; }
      .user-bet-grid { grid-template-columns: 1fr; }
    }

    .fixed-player {
  position: fixed;
  bottom: 0;
  z-index: 0;
  pointer-events: none;
  object-fit: contain;
  opacity: 0.9;
}

.player-left {
  left: 0;
  width: 260px;
  max-height: 82vh;
}

.player-right {
  right: 0;
  width: 300px;
  max-height: 82vh;
}

.app-hero,
.card {
  position: relative;
  z-index: 1;
}

@media (max-width: 1000px) {
  .fixed-player {
    opacity: 0.22;
  }

  .player-left {
    width: 190px;
  }

  .player-right {
    width: 210px;
  }
}

@media (max-width: 640px) {
  .fixed-player {
    display: none;
  }
}
  </style>
</head>
<body>
  <img class="fixed-player player-left" src="messi-removebg-preview.png" alt="">
  <img class="fixed-player player-right" src="oyarzabal-removebg-preview.png" alt="">
  <header class="app-hero">
    <div class="hero-bg">
      <img class="hero-logo" src="https://assets1.afa.com.ar/media/LUCAS-GAIO/Junio-2025/webfifa26.jpg" alt="FIFA World Cup 2026">
      <div>
        <p class="hero-kicker">Porra oficial del grupo</p>
        <h1>Porra mundial de fútbol 2026</h1>
      </div>
    </div>
  </header>

  <div id="logged" class="card" style="display:none">
    <h2 id="welcome"></h2>
    <p>Elige una sección:</p>
    <div class="nav-buttons">
      <button onclick="showSection('matches')">Calendario</button>
      <button onclick="showSection('torneo')">Torneo</button>
      <button onclick="showSection('ranking')">Ranking</button>
      <button onclick="showSection('admin')">Admin</button>
      <button class="logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>

  <div id="adminCard" class="card" style="display:none">
    <h2>Admin</h2>
    <input id="adminPassword" type="password" placeholder="Clave admin">
    <input id="adminPartido" placeholder="ID partido, ej: par_001">
    <input id="adminGolesLocal" type="number" min="0" placeholder="Goles local real">
    <input id="adminGolesVisitante" type="number" min="0" placeholder="Goles visitante real">
    <input id="adminMvp" placeholder="MVP real">
    <input id="adminMaxGoleador" placeholder="Máximo goleador real/es, separados por coma">
    <input id="adminMaxAsistente" placeholder="Máximo asistente real/es, separados por coma">
    <button onclick="guardarResultadoAdmin()">Guardar resultado y cerrar partido</button>
    <hr>
    <h3>Resultado final del torneo</h3>
    <input id="adminTorneoMejorJugador" placeholder="Mejor jugador del torneo">
    <input id="adminTorneoBotaOro" placeholder="Bota de Oro / máximo goleador">
    <input id="adminTorneoMejorJoven" placeholder="Mejor jugador joven">
    <input id="adminTorneoRevelacion" placeholder="Selección revelación">
    <input id="adminTorneoDecepcion" placeholder="Selección decepción">
    <button onclick="guardarResultadosTorneoAdmin()">Guardar resultados finales del torneo</button>
    <div id="adminTorneoMsg" class="msg"></div>
    <div id="adminMsg" class="msg"></div>
  </div>

  <div id="torneoCard" class="card" style="display:none">
  <h2>Apuestas de torneo</h2>
  <p>Estas apuestas se puntuarán al final del Mundial.</p>

  <input id="torneoMejorJugador" placeholder="Mejor jugador del torneo">
  <input id="torneoBotaOro" placeholder="Bota de Oro / máximo goleador del Mundial">
  <input id="torneoMejorJoven" placeholder="Mejor jugador joven">
  <input id="torneoRevelacion" placeholder="Selección revelación">
  <input id="torneoDecepcion" placeholder="Selección decepción">

  <button onclick="guardarApuestaTorneoWeb()">Guardar apuesta de torneo</button>
  <div id="torneoMsg" class="msg"></div>
</div>

  <div id="rankingCard" class="card" style="display:none">
    <h2>Ranking</h2>
    <div id="rankingMsg" class="msg">Ranking pendiente de cargar.</div>
    <div id="rankingList"></div>
    <div id="rankingDetail" class="user-bets" style="display:none"></div>
  </div>

  <div id="matchesCard" class="card" style="display:none">
    <h2>Partidos</h2>
    <div id="matchesMsg" class="msg"></div>
    <div id="matchesList"></div>
  </div>

<div id="loginCard" class="card">
  <h2>Entrar</h2>
  <input id="loginUsuario" placeholder="Usuario">
  <input id="loginPassword" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
  <button class="secondary" onclick="toggleResetPassword()">Olvidé mi contraseña</button>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="resetPasswordCard" class="card" style="display:none">
  <h2>Recuperar contraseña</h2>
  <input id="resetUsuario" placeholder="Usuario">
  <input id="resetEmail" type="email" placeholder="Email usado en el registro">
  <input id="resetPassword1" type="password" placeholder="Nueva contraseña">
  <input id="resetPassword2" type="password" placeholder="Repetir nueva contraseña">
  <button onclick="resetPasswordWeb()">Actualizar contraseña</button>
  <button class="logout" onclick="toggleResetPassword()">Cancelar</button>
  <div id="resetPasswordMsg" class="msg"></div>
</div>

  <div id="registerCard" class="card">
    <h2>Registrarse</h2>
    <input id="regUsuario" placeholder="Usuario">
    <input id="regPassword" type="password" placeholder="Contraseña">
    <input id="regAlias" placeholder="Alias">
    <input id="regNombre" placeholder="Nombre">
    <input id="regEmail" placeholder="Email">
    <button class="secondary" onclick="registrar()">Crear usuario</button>
    <div id="registerMsg" class="msg"></div>
  </div>

  <script>
    const API_URL = 'https://porra-mundial-2026-api.jalvareziconmm.workers.dev/';
    let apuestasUsuario = {};
    let jsonpCounter = 0;

    function apiCall(action, data) {
      const params = new URLSearchParams({
        action: action,
        data: JSON.stringify(data || {}),
        cache: String(Date.now())
      });
    
      return fetch(API_URL + '?' + params.toString())
        .then(function (response) {
          if (!response.ok) {
            throw new Error('Error HTTP ' + response.status);
          }
    
          return response.json();
        });
    }

    function setMsg(id, text, ok) {
      const el = document.getElementById(id);
      el.textContent = text || '';
      el.className = 'msg ' + (ok ? 'ok' : 'error');
    }

    function showLogged(usuario) {
      document.getElementById('logged').style.display = 'block';
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('registerCard').style.display = 'none';
      document.getElementById('welcome').textContent = 'Hola, ' + usuario.alias;
      showSection('matches');
    }

    function showLogin() {
      document.getElementById('logged').style.display = 'none';
      hidePrivateSections();
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('registerCard').style.display = 'block';
      document.getElementById('resetPasswordCard').style.display = 'none';
    }

    function guardarSesion(usuario) {
      localStorage.setItem('porra_usuario', JSON.stringify(usuario));
      showLogged(usuario);
    }

    function logout() {
      localStorage.removeItem('porra_usuario');
      showLogin();
    }

    function registrar() {
      setMsg('registerMsg', 'Registrando...', true);

      const data = {
        usuario: document.getElementById('regUsuario').value,
        password: document.getElementById('regPassword').value,
        alias: document.getElementById('regAlias').value,
        nombre: document.getElementById('regNombre').value,
        email: document.getElementById('regEmail').value
      };

      apiCall('registrarUsuario', data)
        .then(function (res) {
          if (!res.ok) {
            setMsg('registerMsg', res.error, false);
            return;
          }

          setMsg('registerMsg', 'Usuario creado correctamente.', true);
          guardarSesion(res.usuario);
        })
        .catch(function (err) {
          setMsg('registerMsg', err.message, false);
        });
    }

    function login() {
      setMsg('loginMsg', 'Entrando...', true);

      const data = {
        usuario: document.getElementById('loginUsuario').value,
        password: document.getElementById('loginPassword').value
      };

      apiCall('loginUsuario', data)
        .then(function (res) {
          if (!res.ok) {
            setMsg('loginMsg', res.error, false);
            return;
          }

          guardarSesion(res.usuario);
        })
        .catch(function (err) {
          setMsg('loginMsg', err.message, false);
        });
    }

    function formatFecha(value) {
      if (!value) return '';

      const date = new Date(value);
      if (isNaN(date.getTime())) return value;

      return date.toLocaleString('es-ES', {
        dateStyle: 'short',
        timeStyle: 'short'
      });
    }

    function cargarPartidos() {
      document.getElementById('matchesCard').style.display = 'block';
      setMsg('matchesMsg', 'Cargando partidos...', true);

      apiCall('listarPartidos')
        .then(function (res) {
          if (!res.ok) {
            setMsg('matchesMsg', res.error, false);
            return;
          }

          const list = document.getElementById('matchesList');
          list.innerHTML = '';

          res.partidos.forEach(function (partido) {
            const item = document.createElement('div');
            item.className = 'match';
            const apuesta = apuestasUsuario[partido.id_partido] || {};

            item.innerHTML =
              '<div class="match-meta">' +
                partido.fase + ' · ' + formatFecha(partido.fecha_hora) +
              '</div>' +
              '<div class="match-title">' +
                partido.equipo_local + ' vs ' + partido.equipo_visitante +
              '</div>' +
              '<div class="bet-form">' +
                '<input id="gl_' + partido.id_partido + '" type="number" min="0" placeholder="' + partido.equipo_local + '" value="' + (apuesta.goles_local || '') + '">' +
                '<input id="gv_' + partido.id_partido + '" type="number" min="0" placeholder="' + partido.equipo_visitante + '" value="' + (apuesta.goles_visitante || '') + '">' +
                '<input id="mvp_' + partido.id_partido + '" placeholder="MVP" value="' + (apuesta.mvp || '') + '">' +
                '<input id="mg_' + partido.id_partido + '" placeholder="Máximo goleador/es, separados por coma" value="' + (apuesta.max_goleador || '') + '">' +
                '<input id="ma_' + partido.id_partido + '" placeholder="Máximo asistente/s, separados por coma" value="' + (apuesta.max_asistente || '') + '">' +
                '<button onclick="guardarApuestaWeb(&quot;' + partido.id_partido + '&quot;)">Guardar apuesta</button>' +
                '<div id="msg_' + partido.id_partido + '" class="msg">' + (apuesta.id_apuesta ? 'Apuesta ya guardada.' : '') + '</div>' +
              '</div>';

            list.appendChild(item);
          });

          setMsg('matchesMsg', 'Total partidos: ' + res.partidos.length, true);
        })
        .catch(function (err) {
          setMsg('matchesMsg', err.message, false);
        });
    }

    function getSesion() {
      const saved = localStorage.getItem('porra_usuario');
      return saved ? JSON.parse(saved) : null;
    }

    function guardarApuestaWeb(idPartido) {
      const usuario = getSesion();

      if (!usuario) {
        alert('Debes iniciar sesión.');
        return;
      }

      const data = {
        id_usuario: usuario.id_usuario,
        id_partido: idPartido,
        goles_local: document.getElementById('gl_' + idPartido).value,
        goles_visitante: document.getElementById('gv_' + idPartido).value,
        mvp: document.getElementById('mvp_' + idPartido).value,
        max_goleador: document.getElementById('mg_' + idPartido).value,
        max_asistente: document.getElementById('ma_' + idPartido).value
      };

      setMsg('msg_' + idPartido, 'Guardando apuesta...', true);

      apiCall('guardarApuesta', data)
        .then(function (res) {
          if (!res.ok) {
            setMsg('msg_' + idPartido, res.error, false);
            return;
          }

          apuestasUsuario[idPartido] = res.apuesta;
          setMsg('msg_' + idPartido, 'Apuesta guardada.', true);
        })
        .catch(function (err) {
          setMsg('msg_' + idPartido, err.message, false);
        });
    }

    function cargarMisApuestas(callback) {
      const usuario = getSesion();

      if (!usuario) {
        apuestasUsuario = {};
        if (callback) callback();
        return;
      }

      apiCall('listarMisApuestas', { id_usuario: usuario.id_usuario })
        .then(function (res) {
          apuestasUsuario = {};

          if (res.ok) {
            res.apuestas.forEach(function (apuesta) {
              apuestasUsuario[apuesta.id_partido] = apuesta;
            });
          }

          if (callback) callback();
        })
        .catch(function (err) {
          apuestasUsuario = {};
          setMsg('matchesMsg', 'No se pudieron cargar tus apuestas: ' + err.message, false);
          if (callback) callback();
        });
    }

    function guardarResultadoAdmin() {
      const data = {
        admin_password: document.getElementById('adminPassword').value,
        id_partido: document.getElementById('adminPartido').value,
        goles_local_real: document.getElementById('adminGolesLocal').value,
        goles_visitante_real: document.getElementById('adminGolesVisitante').value,
        mvp_real: document.getElementById('adminMvp').value,
        max_goleador_real: document.getElementById('adminMaxGoleador').value,
        max_asistente_real: document.getElementById('adminMaxAsistente').value,
        cerrado: 'SI'
      };

      setMsg('adminMsg', 'Guardando resultado...', true);

      apiCall('guardarResultadoPartido', data)
        .then(function (res) {
          if (!res.ok) {
            setMsg('adminMsg', res.error, false);
            return;
          }

          setMsg(
            'adminMsg',
            'Resultado guardado. Apuestas recalculadas: ' + res.apuestas_recalculadas,
            true
          );

          cargarMisApuestas(function () {
            cargarPartidos();
          });
        })
        .catch(function (err) {
          setMsg('adminMsg', err.message, false);
        });
    }

    function hidePrivateSections() {
      document.getElementById('matchesCard').style.display = 'none';
      document.getElementById('torneoCard').style.display = 'none';
      document.getElementById('rankingCard').style.display = 'none';
      document.getElementById('adminCard').style.display = 'none';
    }

    function showSection(section) {
      hidePrivateSections();

      if (section === 'torneo') {
        document.getElementById('torneoCard').style.display = 'block';
        cargarApuestaTorneo();
      }

      if (section === 'matches') {
        document.getElementById('matchesCard').style.display = 'block';

        cargarMisApuestas(function () {
          cargarPartidos();
        });
      }

      if (section === 'ranking') {
        document.getElementById('rankingCard').style.display = 'block';
        cargarRanking();
      }

      if (section === 'admin') {
        document.getElementById('adminCard').style.display = 'block';
      }
    }

    function cargarRanking() {
      setMsg('rankingMsg', 'Cargando ranking...', true);

      apiCall('listarRanking')
        .then(function (res) {
          if (!res.ok) {
            setMsg('rankingMsg', res.error, false);
            return;
          }

          const list = document.getElementById('rankingList');
          const detail = document.getElementById('rankingDetail');
          list.innerHTML = '';
          detail.style.display = 'none';
          detail.innerHTML = '';

          if (!res.ranking.length) {
            setMsg('rankingMsg', 'Todavía no hay puntuaciones.', true);
            return;
          }

          res.ranking.forEach(function (item) {
            const row = document.createElement('div');
            row.className = 'ranking-row';

            row.innerHTML =
              '<strong>' +
                item.posicion + '. ' +
                '<button class="alias-button" onclick="verApuestasUsuario(&quot;' + item.id_usuario + '&quot;, &quot;' + item.alias.replace(/"/g, '&quot;') + '&quot;)">' +
                  item.alias +
                '</button>' +
              '</strong>' +
              '<span>' + item.puntos + ' pts</span>' +
              '<small>' +
                item.apuestas + ' apuestas · ' +
                item.partidos_puntuados + ' puntuadas' +
              '</small>';

            list.appendChild(row);
          });

          setMsg('rankingMsg', 'Ranking actualizado.', true);
        })
        .catch(function (err) {
          setMsg('rankingMsg', err.message, false);
        });
    }

    function verApuestasUsuario(idUsuario, alias) {
      const detail = document.getElementById('rankingDetail');

      detail.style.display = 'block';
      detail.innerHTML = '<h3>Apuestas de ' + alias + '</h3><div class="msg ok">Cargando apuestas...</div>';

      apiCall('listarApuestasUsuario', { id_usuario: idUsuario })
        .then(function (res) {
          if (!res.ok) {
            detail.innerHTML =
              '<h3>Apuestas de ' + alias + '</h3>' +
              '<div class="msg error">' + res.error + '</div>';
            return;
          }

          if (!res.apuestas.length) {
            detail.innerHTML =
              '<h3>Apuestas de ' + res.usuario.alias + '</h3>' +
              '<div class="msg ok">No hay apuestas visibles todavía. Solo se muestran partidos cerrados.</div>';
            return;
          }

          detail.innerHTML =
            '<h3>Apuestas de ' + res.usuario.alias + '</h3>' +
            '<p>Solo se muestran apuestas de partidos cerrados.</p>';

          res.apuestas.forEach(function (apuesta) {
            const row = document.createElement('div');
            row.className = 'user-bet-row';

            row.innerHTML =
              '<div class="match-meta">' +
                apuesta.fase + ' · ' + formatFecha(apuesta.fecha_hora) +
              '</div>' +
              '<div class="user-bet-title">' +
                apuesta.equipo_local + ' vs ' + apuesta.equipo_visitante +
              '</div>' +
              '<div class="user-bet-grid">' +
                '<div>Resultado: <strong>' + apuesta.goles_local + '-' + apuesta.goles_visitante + '</strong></div>' +
                '<div>Puntos: <strong>' + (apuesta.puntos || '0') + '</strong></div>' +
                '<div>MVP: <strong>' + apuesta.mvp + '</strong></div>' +
                '<div>Máx. goleador: <strong>' + apuesta.max_goleador + '</strong></div>' +
                '<div>Máx. asistente: <strong>' + apuesta.max_asistente + '</strong></div>' +
              '</div>';

            detail.appendChild(row);
          });
        })
        .catch(function (err) {
          detail.innerHTML =
            '<h3>Apuestas de ' + alias + '</h3>' +
            '<div class="msg error">' + err.message + '</div>';
        });
    }

    function cargarApuestaTorneo() {
  const usuario = getSesion();

  if (!usuario) {
    setMsg('torneoMsg', 'Debes iniciar sesión.', false);
    return;
  }

  setMsg('torneoMsg', 'Cargando apuesta de torneo...', true);

  apiCall('listarApuestaTorneo', {
    id_usuario: usuario.id_usuario
  })
    .then(function (res) {
      if (!res.ok) {
        setMsg('torneoMsg', res.error, false);
        return;
      }

      if (res.apuesta) {
        document.getElementById('torneoMejorJugador').value = res.apuesta.mejor_jugador || '';
        document.getElementById('torneoBotaOro').value = res.apuesta.bota_oro || '';
        document.getElementById('torneoMejorJoven').value = res.apuesta.mejor_joven || '';
        document.getElementById('torneoRevelacion').value = res.apuesta.seleccion_revelacion || '';
        document.getElementById('torneoDecepcion').value = res.apuesta.seleccion_decepcion || '';
        setMsg('torneoMsg', 'Apuesta de torneo cargada.', true);
      } else {
        setMsg('torneoMsg', 'Todavía no has guardado apuesta de torneo.', true);
      }

      if (res.cerrado) {
        setMsg('torneoMsg', 'Las apuestas de torneo ya están cerradas.', false);
      }
    })
    .catch(function (err) {
      setMsg('torneoMsg', err.message, false);
    });
}

    function toggleResetPassword() {
  const card = document.getElementById('resetPasswordCard');
  card.style.display = card.style.display === 'none' ? 'block' : 'none';
}

function resetPasswordWeb() {
  const data = {
    usuario: document.getElementById('resetUsuario').value,
    email: document.getElementById('resetEmail').value,
    nueva_password: document.getElementById('resetPassword1').value,
    repetir_password: document.getElementById('resetPassword2').value
  };

  setMsg('resetPasswordMsg', 'Actualizando contraseña...', true);

  apiCall('resetPasswordConEmail', data)
    .then(function (res) {
      if (!res.ok) {
        setMsg('resetPasswordMsg', res.error, false);
        return;
      }

      setMsg('resetPasswordMsg', 'Contraseña actualizada. Ya puedes iniciar sesión.', true);
      document.getElementById('loginUsuario').value = data.usuario;
      document.getElementById('loginPassword').value = '';
    })
    .catch(function (err) {
      setMsg('resetPasswordMsg', err.message, false);
    });
}

    const saved = localStorage.getItem('porra_usuario');

    if (saved) {
      showLogged(JSON.parse(saved));
    } else {
      showLogin();
    }
